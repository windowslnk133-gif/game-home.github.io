<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ohio 2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #050014; color: #fff; font-family: monospace; overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh; user-select: none; }
        #hud { margin-top: 10px; text-align: center; background: rgba(0,0,0,0.85); padding: 10px; border: 2px solid #ffcc00; border-radius: 8px; width: 95vw; max-width: 900px; }
        .bar-container { display: flex; gap: 15px; margin-top: 5px; }
        .bar-wrapper { flex: 1; position: relative; height: 18px; background: #222; border: 1px solid #fff; border-radius: 3px; overflow: hidden; }
        #player-hp-bar { width: 100%; height: 100%; background: #00ffcc; transition: width 0.1s; }
        #boss-hp-bar { width: 100%; height: 100%; background: #ff0055; transition: width 0.05s; }
        .bar-text { position: absolute; width: 100%; text-align: center; font-size: 11px; line-height: 16px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        #status-row { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-top: 5px; }
        #game-stage { width: 95vw; height: 60vh; position: relative; margin-top: 10px; background: linear-gradient(#110022,#2d004d); border: 4px solid #ffcc00; overflow: hidden; }
        #ground { position: absolute; bottom: 0; width: 100%; height: 40px; background: #222; border-top: 4px solid #ffcc00; }
        #player { position: absolute; bottom: 40px; left: 50px; font-size: 42px; }
        #shield-effect { position: absolute; font-size: 35px; top: -10px; display: none; animation: s 2s infinite linear; }
        @keyframes s { 100% { transform: rotate(360deg); } }
        .solid-obj { position: absolute; font-size: 45px; cursor: pointer; transition: 0.2s; }
        .solid-block { position: absolute; font-size: 35px; }
        .family-member { position: absolute; bottom: 40px; font-size: 40px; }
        .truck { position: absolute; bottom: 40px; font-size: 55px; }
        #boss { position: absolute; bottom: 40px; right: 80px; font-size: 95px; transition: 0.1s; }
        #computer-indicator { position: absolute; bottom: 40px; height: 100%; background: rgba(255,0,0,0.4); border: 2px dashed red; display: none; }
        .salary-money { position: absolute; font-size: 30px; animation: f 0.6s ease-out forwards; pointer-events: none; }
        @keyframes f { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }
        #leaderboard-area { margin: 10px 0; background: rgba(0,0,0,0.6); border: 1px dashed #ffcc00; padding: 10px; border-radius: 5px; width: 85%; }
        #leaderboard-list { padding-left: 20px; color: #00ffcc; font-size: 13px; text-align: left; }
        #game-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10,0,20,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #mobile-controls { display: none; position: fixed; bottom: 20px; width: 100vw; justify-content: space-between; padding: 0 20px; pointer-events: none; }
        .mobile-btn { width: 65px; height: 65px; background: rgba(255,255,255,0.15); border: 3px solid #ffcc00; border-radius: 50%; color: #ffcc00; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        #mb-attack { border-color: #ff0055; color: #ff0055; background: rgba(255,0,85,0.1); }
        @media (max-width: 768px) { #game-stage { height: 45vh; } #boss { font-size: 65px; } #sofa { left: 100px!important; } #table { left: 200px!important; } #shoes { left: 300px!important; } }
    </style>
</head>
<body>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <div id="google-auth-box" style="width:100vw; background:rgba(0,0,0,0.85); padding:8px; display:flex; justify-content:center; align-items:center; gap:15px; border-bottom:2px solid #ffcc00; z-index:200;">
        <span id="google-user-status" style="color:#ff3333; font-size:12px; font-weight:bold;">[未登入] 綁定 Google 帳號</span>
        <div id="google-login-btn"></div>
    </div>
    <div id="hud">
        <div class="hud-title"><span id="current-stage-text">連線遠端配置...</span></div>
        <div class="bar-container">
            <div class="bar-wrapper"><div id="player-hp-bar"></div><div class="bar-text" id="player-hp-text">120 / 120</div></div>
            <div class="bar-wrapper" id="boss-hud" style="display:none;"><div id="boss-hp-bar"></div><div class="bar-text" id="boss-hp-text">1200 / 1200</div></div>
        </div>
        <div id="status-row">
            <span id="cd-shield">防禦[R]: <span style="color:#00ffcc">就緒</span></span>
            <span>耗時: <span id="timer-display">0.0</span>秒</span>
            <span id="objective-text">請求遠端環境中...</span>
        </div>
    </div>
    <div id="game-stage">
        <div id="announcement" style="position:absolute; top:30%; width:100%; text-align:center; font-size:30px; font-weight:bold; color:#ff0055; display:none;"></div>
        <div id="ground"></div>
        <div id="player">🦆<div id="shield-effect">🛡️</div></div>
        <div id="stage1-elements">
            <div class="solid-obj" id="sofa" data-name="沙發" style="left:250px; bottom:40px;">🛋️</div>
            <div class="solid-obj" id="table" data-name="桌子" style="left:500px; bottom:40px;">🪑</div>
            <div class="solid-obj" id="shoes" data-name="鞋子" style="left:750px; bottom:40px;">👞</div>
            <div class="solid-block" style="left:180px; bottom:40px;">💧</div>
            <div class="solid-block" style="left:420px; bottom:40px;">🕷️</div>
            <div class="solid-block" style="left:680px; bottom:40px;">📱</div>
            <div class="family-member" id="member-dad" style="left:350px;">👨</div>
            <div class="family-member" id="member-mom" style="left:600px;">👩</div>
            <div class="family-member" id="member-dog" style="left:850px;">🐶</div>
            <div style="position:absolute; right:20px; bottom:40px; font-size:50px;">🚪</div>
        </div>
        <div id="stage2-elements" style="display:none;"></div>
        <div id="stage3-elements" style="display:none;">
            <div id="boss">👨‍💼</div>
            <div id="computer-indicator"></div>
            <div id="computer-boss" style="display:none; position:absolute; bottom:40px; font-size:70px; z-index:5;">🖥️</div>
        </div>
    </div>
    <div id="game-overlay" style="display:none;">
        <h2 id="overlay-title">決戰之巔</h2>
        <p id="overlay-desc" style="font-size:14px; margin:10px 0; color:#ddd;"></p>
        <div id="leaderboard-area" style="display:none;">
            <h4>🏆 最速巨鴨榜 (JSON)</h4>
            <ol id="leaderboard-list"></ol>
        </div>
        <button id="game-overlay-btn" style="margin-top:10px; padding: 8px 16px; font-weight: bold; cursor: pointer;">開戰！</button>
    </div>
    <div id="mobile-controls">
        <div style="display:flex; gap:10px;"><div class="mobile-btn" id="mb-left">A</div><div class="mobile-btn" id="mb-right">D</div></div>
        <div class="mobile-btn" id="mb-attack">E</div>
    </div>
    <script>
        let currentStage=1, playerHp=120, isPlayingG=false, hasKey=false, keyLocation="", stageConfigData=null, googlePlayerName="匿名巨鴨";
        let playerX=50, playerY=0, playerVy=0, isGrounded=true, gravity=0.6, jumpForce=13, moveSpeed=5;
        let isShieldActive=false, isShieldReady=true, keys={w:false,a:false,s:false,d:false,space:false,t:false};
        let truckTimer=0, stage2Progress=0, bossActionTimer=0, bossHp=1200, gameStartTime=0, totalElapsedSeconds=0, familyVel={dad:3,mom:-4,dog:5};
        let animationId = null;

        const pEl=document.getElementById('player'), shieldEff=document.getElementById('shield-effect'), stageEl=document.getElementById('game-stage'), pHpBar=document.getElementById('player-hp-bar'), pHpText=document.getElementById('player-hp-text'), bHpBar=document.getElementById('boss-hp-bar'), bHpText=document.getElementById('boss-hp-text'), cdShieldEl=document.getElementById('cd-shield'), objText=document.getElementById('objective-text'), timerDisplay=document.getElementById('timer-display'), overlay=document.getElementById('game-overlay'), overlayTitle=document.getElementById('overlay-title'), overlayDesc=document.getElementById('overlay-desc'), overlayBtn=document.getElementById('game-overlay-btn'), leaderboardArea=document.getElementById('leaderboard-area'), leaderboardList=document.getElementById('leaderboard-list');
        const localBGM=new Audio('./boss_musin.mp3'); localBGM.loop=true; localBGM.volume=0.25;

        const GameTools={
            playMusic:()=>{localBGM.play().catch(()=>{});}, stopMusic:()=>{localBGM.pause(); localBGM.currentTime=0;},
            checkCollision:(e1,e2)=>{const r1=e1.getBoundingClientRect(), r2=e2.getBoundingClientRect(); return !(r1.right<r2.left || r1.left>r2.right || r1.bottom<r2.top || r1.top>r2.bottom);},
            spawnMoney:(x,y)=>{const m=document.createElement('div'); m.className='salary-money'; m.textContent='💰'; m.style.left=x+'px'; m.style.bottom=y+'px'; stageEl.appendChild(m); setTimeout(()=>m.remove(),600);},
            flash:(el)=>{el.style.opacity='0.3'; setTimeout(()=>el.style.opacity='1',150);}
        };

        const defaultStageConfig = {
            stage1: { name: "第 1 關：客廳秘境", objective: "尋找房間內的鑰匙以開啟大門！", familySpeed: { dad: 3, mom: -4, dog: 5 } },
            stage2: { name: "第 2 關：公路逃亡", objective: "躲避卡車衝撞！", spawnRate: 60, truckSpeed: 8 },
            stage3: { name: "第 3 關：決戰 Boss", objective: "擊敗老闆！", bossHp: 1200, bossAttackRate: 90 }
        };

        function initGoogleAuth() {
            if(typeof google==='undefined'){setTimeout(initGoogleAuth,200); return;}
            google.accounts.id.initialize({
                client_id: "YOUR_CLIENT_ID.apps.googleusercontent.com", 
                callback: r=>{
                    try {
                        const tokenParts = r.credential.split('.');
                        const cleanPayload = tokenParts[1].replace(/-/g,'+').replace(/_/g,'/');
                        const p=JSON.parse(decodeURIComponent(window.atob(cleanPayload).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
                        googlePlayerName=p.name;
                        document.getElementById('google-user-status').innerHTML=`🟢 驗證成功：${googlePlayerName}`;
                        document.getElementById('google-login-btn').style.display='none';
                    } catch(err) {
                        console.error("解碼失敗:", err);
                    }
                }
            });
            google.accounts.id.renderButton(document.getElementById("google-login-btn"),{theme:"dark",size:"medium",shape:"pill"});
        }

        async function loadGameStageSettings() {
            let url='./ohio-json.json'; 
            try {
                const res=await fetch(url); 
                stageConfigData=await res.json();
            } catch(e) { 
                stageConfigData = defaultStageConfig; 
            }
            document.getElementById('current-stage-text').textContent="第 1 關";
            showOverlay("Ohio 2 完全體","[W/A/S/D]移動/跳躍，[R]防禦，[E]攻擊。\nT+3可直接跳關。請先登入Google以記錄排行！","開戰！");
        }

        function detect() {
            const isM=/Android|iPhone|iPad/i.test(navigator.userAgent)||window.innerWidth<=768, p=document.getElementById('mobile-controls');
            if(isM&&p){ 
                p.style.display='flex'; 
                moveSpeed=4; 
                document.getElementById('mb-left').ontouchstart=()=>{keys.a=true;}; 
                document.getElementById('mb-left').ontouchend=()=>{keys.a=false;}; 
                document.getElementById('mb-right').ontouchstart=()=>{keys.d=true;}; 
                document.getElementById('mb-right').ontouchend=()=>{keys.d=false;}; 
                document.getElementById('mb-attack').ontouchstart=e=>{e.preventDefault(); if(isPlayingG)triggerAttack();}; 
                stageEl.ontouchstart=e=>{if(e.touches[0].clientY<window.innerHeight*0.5){keys.w=true; setTimeout(()=>keys.w=false,100);}}; 
            }
        }

        window.addEventListener('load',()=>{detect(); loadGameStageSettings(); initGoogleAuth();});
        
        overlayBtn.addEventListener('click',()=>{
            overlay.style.display='none'; 
            leaderboardArea.style.display='none'; 
            if(playerHp<=0||currentStage>3){
                currentStage=1; 
                playerHp=120; 
                setupStage1(); 
                gameStartTime=performance.now(); 
                totalElapsedSeconds=0;
            } else if (currentStage === 1) {
                setupStage1();
                gameStartTime=performance.now();
            }
            isPlayingG=true; 
            GameTools.playMusic(); 
            gameLoop();
        });

        window.addEventListener('keydown',e=>{ 
            if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft')keys.a=true; 
            if(e.key==='d'||e.key==='D'||e.key==='ArrowRight')keys.d=true; 
            if(e.key==='w'||e.key==='W'||e.key==='ArrowUp')keys.w=true; 
            if(e.key==='s'||e.key==='S'||e.key==='ArrowDown')keys.s=true; 
            if(e.code==='Space'){keys.space=true; e.preventDefault();} 
            if(e.key==='t'||e.key==='T')keys.t=true; 
            if(keys.t&&(e.key==='3')) {if(isPlayingG&&currentStage!==3)setupStage3();} 
            if(e.key==='r'||e.key==='R')triggerShield(); 
            if(e.key==='e'||e.key==='E')triggerAttack();
        });

        window.addEventListener('keyup',e=>{ 
            if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft')keys.a=false; 
            if(e.key==='d'||e.key==='D'||e.key==='ArrowRight')keys.d=false; 
            if(e.key==='w'||e.key==='W'||e.key==='ArrowUp')keys.w=false; 
            if(e.key==='s'||e.key==='S'||e.key==='ArrowDown')keys.s=false; 
            if(e.code==='Space')keys.space=false; 
            if(e.key==='t'||e.key==='T')keys.t=false;
        });

        function setupStage1(){ 
            currentStage=1; playerX=50; playerY=0; hasKey=false; 
            const c=stageConfigData.stage1; 
            document.getElementById('current-stage-text').textContent=c.name; 
            objText.textContent=c.objective; 
            familyVel={...c.familySpeed}; 
            document.getElementById('stage1-elements').style.display='block'; 
            document.getElementById('stage2-elements').style.display='none'; 
            document.getElementById('stage3-elements').style.display='none'; 
            document.getElementById('boss-hud').style.display='none'; 
            if(window.innerWidth<=768){
                document.getElementById('sofa').style.left='60px'; 
                document.getElementById('table').style.left='140px'; 
                document.getElementById('shoes').style.left='220px';
            } 
            keyLocation=["沙發","桌子","鞋子"][Math.floor(Math.random()*3)]; 
            document.querySelectorAll('.solid-obj').forEach(item=>{ 
                if(item.id==='sofa')item.textContent='🛋️'; 
                if(item.id==='table')item.textContent='🪑'; 
                if(item.id==='shoes')item.textContent='👞'; 
                item.onclick=()=>{
                    if(currentStage!==1||!isPlayingG)return; 
                    if(Math.abs(pEl.getBoundingClientRect().left-item.getBoundingClientRect().left)<100){
                        const n=item.getAttribute('data-name'); 
                        if(n===keyLocation){
                            hasKey=true; 
                            item.textContent='❌'; 
                            objText.textContent="🔑拿到鑰匙！快去右邊門(🚪)！";
                        }else{
                            objText.textContent=`調查了${n}，空的...`;
                        }
                    }
                };
            });
        }

        function setupStage2(){ 
            currentStage=2; playerX=50; playerY=0; stage2Progress=0; truckTimer=0; 
            const c=stageConfigData.stage2; 
            document.getElementById('current-stage-text').textContent=c.name; 
            objText.textContent=c.objective; 
            document.getElementById('stage1-elements').style.display='none'; 
            document.getElementById('stage2-elements').style.display='block'; 
            document.getElementById('stage2-elements').innerHTML='';
        }

        function setupStage3(){ 
            currentStage=3; playerX=100; playerY=0; bossActionTimer=0; 
            const c=stageConfigData.stage3; 
            bossHp=c.bossHp; 
            document.getElementById('current-stage-text').textContent=c.name; 
            objText.textContent=c.objective; 
            document.getElementById('stage1-elements').style.display='none'; 
            document.getElementById('stage2-elements').style.display='none'; 
            document.getElementById('stage3-elements').style.display='block'; 
            document.getElementById('boss-hud').style.display='block'; 
            document.getElementById('computer-indicator').style.display='none'; 
            document.getElementById('computer-boss').style.display='none'; 
            const b=document.getElementById('boss'); 
            b.style.transform='scale(1)'; 
            b.style.left=''; 
            updateHpUI();
        }

        function triggerShield(){
            if(!isShieldReady||!isPlayingG)return; 
            isShieldReady=false; isShieldActive=true; 
            shieldEff.style.display='block'; 
            cdShieldEl.innerHTML=`防禦[R]: <span style="color:#ff3333">CD</span>`; 
            setTimeout(()=>{isShieldActive=false; shieldEff.style.display='none';},500); 
            setTimeout(()=>{isShieldReady=true; if(isPlayingG)cdShieldEl.innerHTML=`防禦[R]: <span style="color:#00ffcc">就緒</span>`;},2000);
        }

        function triggerAttack(){
            if(currentStage!==3||!isPlayingG)return; 
            const pR=pEl.getBoundingClientRect(), bR=document.getElementById('boss').getBoundingClientRect(); 
            if(pR.right>=bR.left-50&&pR.left<=bR.right+50){
                bossHp=Math.max(0,bossHp-15); 
                updateHpUI(); 
                GameTools.spawnMoney(bR.left-stageEl.getBoundingClientRect().left+40,150); 
                const b=document.getElementById('boss'); 
                b.style.transform='scale(0.9) translateX(10px)'; 
                setTimeout(()=>b.style.transform='scale(1)',100); 
                if(bossHp<=0)gameWin();
            }
        }

        function gameLoop() {
            if(!isPlayingG)return; 
            totalElapsedSeconds=(performance.now()-gameStartTime)/1000; 
            timerDisplay.textContent=totalElapsedSeconds.toFixed(1);

            let nX=playerX; 
            if(keys.a)nX-=moveSpeed; 
            if(keys.d)nX+=moveSpeed; 
            if(nX<0)nX=0; 
            if(nX>stageEl.clientWidth-50)nX=stageEl.clientWidth-50;

            let isB=false; 
            if(currentStage===1){
                pEl.style.left=nX+'px'; 
                document.querySelectorAll('.solid-block').forEach(b=>{if(GameTools.checkCollision(pEl,b))isB=true;});
            } 
            if(!isB)playerX=nX;

            if((keys.w||keys.space)&&isGrounded){playerVy=jumpForce; isGrounded=false;} 
            playerVy -= gravity; 
            playerY+=playerVy; 
            if(playerY<=0){playerY=0; playerVy=0; isGrounded=true;}

            pEl.style.left=playerX+'px'; 
            pEl.style.bottom=(40+playerY)+'px';

            if(currentStage===1){ 
                m('member-dad','dad',200,stageEl.clientWidth*0.45); 
                m('member-mom','mom',stageEl.clientWidth*0.4,stageEl.clientWidth*0.7); 
                m('member-dog','dog',stageEl.clientWidth*0.65,stageEl.clientWidth*0.9); 
                document.querySelectorAll('.family-member').forEach(mEl=>{if(GameTools.checkCollision(pEl,mEl))takeDamage(15);}); 
                if(hasKey&&playerX>=stageEl.clientWidth-90)setupStage2(); 
            }
            else if(currentStage===2){ 
                stage2Progress+=0.2; 
                objText.textContent=`公路逃亡進度: ${Math.floor(stage2Progress)}%`; 
                if(stage2Progress>=100)setupStage3(); 
                truckTimer++; 
                if(truckTimer%stageConfigData.stage2.spawnRate===0){
                    const t=document.createElement('div'); 
                    t.className='truck'; 
                    t.textContent='🚚'; 
                    t.style.left=stageEl.clientWidth+'px'; 
                    document.getElementById('stage2-elements').appendChild(t);
                } 
                document.querySelectorAll('.truck').forEach(t => { 
                    let tx=parseFloat(t.style.left)-stageConfigData.stage2.truckSpeed; 
                    t.style.left=tx+'px'; 
                    if(GameTools.checkCollision(pEl,t)){takeDamage(25); t.remove();} 
                    if(tx<-80)t.remove(); 
                }); 
            }
            else if(currentStage===3){ 
                bossActionTimer++; 
                if(bossActionTimer>=stageConfigData.stage3.bossAttackRate){
                    bossActionTimer=0; 
                    Math.random()>0.5?dash():slam();
                } 
                if(GameTools.checkCollision(pEl,document.getElementById('boss')))takeDamage(10);
            }

            updateHpUI(); 
            animationId=requestAnimationFrame(gameLoop);
        }

        function m(id,key,minX,maxX){
            const el=document.getElementById(id); 
            if(!el)return; 
            let x=(parseFloat(el.style.left)||minX)+familyVel[key]; 
            if(x<=minX||x>=maxX)familyVel[key]=-familyVel[key]; 
            el.style.left=x+'px';
        }

        function dash(){
            const rX=Math.random()*(stageEl.clientWidth-200)+50, b=document.getElementById('boss'); 
            b.style.left=rX+'px'; 
            b.style.transform='scale(1.2) rotate(15deg)'; 
            setTimeout(()=>b.style.transform='scale(1) rotate(0deg)',300);
        }

        function slam(){
            const ind=document.getElementById('computer-indicator'), comp=document.getElementById('computer-boss'), tX=playerX; 
            ind.style.left=(tX-25)+'px'; 
            ind.style.width='100px'; 
            ind.style.display='block'; 
            setTimeout(()=>{
                ind.style.display='none'; 
                if(!isPlayingG)return; 
                comp.style.left=(tX-10)+'px'; 
                comp.style.display='block'; 
                if(Math.abs(playerX-tX)<60&&playerY<50)takeDamage(40); 
                setTimeout(()=>comp.style.display='none',800);
            },1200);
        }

        function takeDamage(a){
            if(isShieldActive)return; 
            playerHp=Math.max(0,playerHp-a); 
            GameTools.flash(pEl); 
            if(playerHp<=0)gameOver();
        }

        function updateHpUI(){
            pHpBar.style.width=(playerHp/120)*100+'%'; 
            pHpText.textContent=Math.floor(playerHp)+' / 120'; 
            bHpBar.style.width=(bossHp/1200)*100+'%'; 
            bHpText.textContent=Math.floor(bossHp)+' / 1200';
        }

        const JL={
            get:()=>{const d=localStorage.getItem('o2_j'); return d?JSON.parse(d):[];},
            save:(n,s)=>{
                let l=JL.get(); 
                l.push({n:n,t:parseFloat(s.toFixed(1))}); 
                l.sort((a,b)=>a.t-b.t); 
                l=l.slice(0,5); 
                localStorage.setItem('o2_j',JSON.stringify(l));
            },
            render:()=>{
                leaderboardList.innerHTML=''; 
                const l=JL.get(); 
                if(l.length===0){leaderboardList.innerHTML='暫無紀錄';return;} 
                l.forEach((entry,i)=>{
                    const li=document.createElement('li'); 
                    li.innerHTML=`${i+1}. <b>${entry.n}</b> <span style="float:right;">⏱️ ${entry.t}秒</span>`; 
                    leaderboardList.appendChild(li);
                });
            }
        };

        function gameOver(){
            isPlayingG=false; 
            cancelAnimationFrame(animationId); 
            GameTools.stopMusic(); 
            showOverlay("💀 巨鴨慘遭逮捕","你變成了美味烤鴨...","重來"); 
            JL.render(); 
            leaderboardArea.style.display='block';
        }

        function gameWin(){
            isPlayingG=false; 
            cancelAnimationFrame(animationId); 
            GameTools.stopMusic(); 
            let n=googlePlayerName; 
            if(n==="匿名巨鴨"){
                const a=prompt("🎉 逆襲成功！輸入大名：","未登入巨鴨"); 
                if(a&&a.trim()!=="")n=a;
            } 
            JL.save(n,totalElapsedSeconds); 
            showOverlay("🏆 勞動節大勝利！",`總共耗時：${totalElapsedSeconds.toFixed(1)}秒！`,"再玩一次"); 
            JL.render(); 
            leaderboardArea.style.display='block';
        }

        function showOverlay(t,d,b){
            overlayTitle.textContent=t; 
            overlayDesc.textContent=d; 
            overlayBtn.textContent=b; 
            overlay.style.display='flex';
        }
    </script>
</body>
</html>
