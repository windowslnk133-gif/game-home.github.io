<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Style Web 3D Remake</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: sans-serif;
        }
        /* 畫面中心的準心 */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        /* 開始與提示畫面 */
        #instructions {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            color: #ccc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            z-index: 10;
        }
        #instructions h1 { color: #fff; font-size: 2rem; letter-spacing: 4px; }
        #instructions p { font-size: 1.1rem; line-height: 1.8; }
    </style>
    <!-- 引入 Three.js 核心庫與第一人稱控制器 (PointerLockControls) -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="instructions">
        <h1>G R A C E (Web Prototype)</h1>
        <p>
            點擊螢幕開始探索<br><br>
            <b>W, A, S, D</b> - 移動方向<br>
            <b>滑鼠</b> - 轉動視角查看四周
        </p>
    </div>

    <script>
        // 1. 基本場景設定
        const scene = new THREE.Scene();
        // 加入壓抑的深灰色迷霧 (顏色, 近距離, 遠距離)
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.08); 

        // 2. 相機 (第一人稱視角)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 2; // 玩家身高約 2 單位

        // 3. 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // 開啟陰影增強恐怖感
        document.body.appendChild(renderer.domElement);

        // 4. 第一人稱控制器
        const controls = new THREE.PointerLockControls(camera, document.body);
        const instructions = document.getElementById('instructions');

        instructions.addEventListener('click', () => {
            controls.lock(); // 點擊畫面後，鎖定滑鼠進入遊戲
        });
        controls.addEventListener('lock', () => instructions.style.display = 'none');
        controls.addEventListener('unlock', () => instructions.style.display = 'flex');

        // 5. 鍵盤移動邏輯
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        // 6. 光源設計 (手電筒 & 走廊頂燈)
        // 微弱環境光
        const ambientLight = new THREE.AmbientLight(0x111111);
        scene.add(ambientLight);

        // 手電筒 (綁定在相機上的聚光燈)
        const flashlight = new THREE.SpotLight(0xffffff, 1.5, 25, Math.PI / 6, 0.5, 1);
        flashlight.castShadow = true;
        scene.add(flashlight);
        scene.add(flashlight.target); // 手電筒需要一個照射目標

        // 走廊頂燈 (會閃爍的幽靈燈光)
        const ceilingLight = new THREE.PointLight(0xffddaa, 1.2, 15);
        ceilingLight.position.set(0, 4.5, -15);
        scene.add(ceilingLight);

        // 7. 建立走廊場景 (牆壁、地板、天花板)
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });

        // 走廊長度 50, 寬度 4, 高度 5
        const corridorWidth = 4;
        const corridorHeight = 5;
        const corridorLength = 60;

        // 地板
        const floorGeo = new THREE.PlaneGeometry(corridorWidth, corridorLength);
        const floor = new THREE.Mesh(floorGeo, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 天花板
        const ceilingGeo = new THREE.PlaneGeometry(corridorWidth, corridorLength);
        const ceiling = new THREE.Mesh(ceilingGeo, wallMaterial);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = corridorHeight;
        scene.add(ceiling);

        // 左牆
        const leftWallGeo = new THREE.PlaneGeometry(corridorLength, corridorHeight);
        const leftWall = new THREE.Mesh(leftWallGeo, wallMaterial);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.position.set(-corridorWidth/2, corridorHeight/2, 0);
        leftWall.receiveShadow = true;
        scene.add(leftWall);

        // 右牆
        const rightWallGeo = new THREE.PlaneGeometry(corridorLength, corridorHeight);
        const rightWall = new THREE.Mesh(rightWallGeo, wallMaterial);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.set(corridorWidth/2, corridorHeight/2, 0);
        rightWall.receiveShadow = true;
        scene.add(rightWall);

        // 盡頭的門 (一個神祕的黑色矩形)
        const doorGeo = new THREE.BoxGeometry(1.5, 3, 0.1);
        const doorMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9 });
        const door = new THREE.Mesh(doorGeo, doorMat);
        door.position.set(0, 1.5, -25);
        scene.add(door);

        // 8. 遊戲主要迴圈 (每秒 60 幀更新)
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked) {
                const delta = clock.getDelta();

                // 阻尼/摩擦力減速
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                // 計算移動方向 (前進速度調低，營造漫步的沉浸感)
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); 

                const walkSpeed = 12.0; // 控制走路速度
                if (moveForward || moveBackward) velocity.z -= direction.z * walkSpeed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * walkSpeed * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // 限制邊界 (不讓玩家穿牆)
                if (camera.position.x > 1.7) camera.position.x = 1.7;
                if (camera.position.x < -1.7) camera.position.x = -1.7;
                if (camera.position.z > 25) camera.position.z = 25;
                if (camera.position.z < -24.5) camera.position.z = -24.5; // 門前停下
            }

            // 更新手電筒位置與角度 (跟隨相機)
            flashlight.position.copy(camera.position);
            const vector = new THREE.Vector3(0, 0, -1);
            vector.applyQuaternion(camera.quaternion);
            flashlight.target.position.copy(camera.position).add(vector);

            // 【事件觸發】當玩家走近遠處的頂燈時 (-10 附近)，頂燈開始恐怖地隨機閃爍
            if (camera.position.z < -2) {
                if (Math.random() > 0.92) {
                    ceilingLight.intensity = Math.random() * 2.0;
                }
            } else {
                ceilingLight.intensity = 1.2; // 離得遠時正常亮著
            }

            renderer.render(scene, camera);
        }

        animate();

        // 視窗縮放適應
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
