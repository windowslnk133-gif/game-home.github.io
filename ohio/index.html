<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ohio 2 - 整合 Google 登入純前端版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #050014; color: #fff; font-family: monospace; overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh; user-select: none; }
        #google-auth-box { width: 100vw; background: rgba(0,0,0,0.85); padding: 8px; display: flex; justify-content: center; align-items: center; gap: 15px; border-bottom: 2px solid #ffcc00; z-index: 200; }
        #google-user-status { color: #ff3333; font-size: 12px; font-weight: bold; }
        #hud { margin-top: 10px; text-align: center; background: rgba(0,0,0,0.85); padding: 10px; border: 2px solid #ffcc00; border-radius: 8px; width: 95vw; max-width: 900px; }
        #game-stage { width: 95vw; height: 60vh; position: relative; margin-top: 10px; background: linear-gradient(#110022,#2d004d); border: 4px solid #ffcc00; overflow: hidden; }
        #ground { position: absolute; bottom: 0; width: 100%; height: 40px; background: #222; border-top: 4px solid #ffcc00; }
        #player { position: absolute; bottom: 40px; left: 50px; font-size: 42px; }
        #boss { position: absolute; bottom: 40px; right: 40px; font-size: 95px; }
        #leaderboard-area { margin: 10px 0; background: rgba(0,0,0,0.6); border: 1px dashed #ffcc00; padding: 10px; border-radius: 5px; width: 85%; }
        #leaderboard-list { padding-left: 20px; color: #00ffcc; font-size: 13px; text-align: left; }
        #game-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10,0,20,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        button { padding: 8px 16px; background: #ffcc00; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
    </style>
    <!-- 引入 Google 登入官方 SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <!-- Google 登入狀態列 -->
    <div id="google-auth-box">
        <span id="google-user-status">[未登入] 綁定 Google 帳號登錄排行榜</span>
        <div id="google-login-btn"></div>
    </div>

    <div id="hud">
        <div class="hud-title"><span id="current-stage-text">載入關卡中...</span></div>
        <div id="status-row" style="margin-top: 5px; font-size: 12px; color: #aaa;">
            <span>耗時: <span id="timer-display">0.0</span> 秒</span>
            <span id="objective-text">載入中...</span>
        </div>
    </div>

    <div id="game-stage">
        <div id="ground"></div>
        <div id="player">🦆</div>
        <div id="stage3-elements">
            <div id="boss">👨‍💼</div>
        </div>
    </div>

    <div id="game-overlay">
        <h2 id="overlay-title">Ohio 2 純靜態網頁版</h2>
        <p id="overlay-desc" style="font-size: 14px; margin: 10px 0; color: #ddd;">讀取 data.js 設定中...</p>
        <div id="leaderboard-area">
            <h4>🏆 最速巨鴨排行榜 (Local)</h4>
            <ol id="leaderboard-list"></ol>
        </div>
        <button id="game-overlay-btn">開戰！</button>
    </div>

    <!-- 先引入 data.js 檔案 -->
    <script src="./data.js"></script>

    <script>
        let gameStartTime = 0, totalElapsedSeconds = 0, isPlaying = false;

        // 初始化 Google 登入（元件 ID 與成功後的回呼）
        window.addEventListener('load', () => {
            GoogleAuthModule.init('google-user-status', 'google-login-btn', (user) => {
                console.log("登入成功，玩家為:", user.name);
            });
            renderLeaderboard();
            document.getElementById('overlay-desc').textContent = gameConfig.stage3.objective;
        });

        // 渲染排行榜
        function renderLeaderboard() {
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = '';
            const scores = LeaderboardData.get();
            scores.forEach((item) => {
                const li = document.createElement('li');
                li.innerHTML = `<b>${item.name}</b> <span style="float:right;">⏱️ ${item.time} 秒</span>`;
                listEl.appendChild(li);
            });
        }

        document.getElementById('game-overlay-btn').onclick = () => {
            document.getElementById('game-overlay').style.display = 'none';
            isPlaying = true;
            gameStartTime = performance.now();
            gameLoop();
        };

        function gameLoop() {
            if(!isPlaying) return;
            totalElapsedSeconds = (performance.now() - gameStartTime) / 1000;
            document.getElementById('timer-display').textContent = totalElapsedSeconds.toFixed(1);
            requestAnimationFrame(gameLoop);
        }

        // 遊戲勝利時，直接從 data.js 讀取 Google 玩家名稱或彈窗輸入
        function gameWin() {
            isPlaying = false;
            let playerName = GoogleAuthModule.getPlayerName();
            
            if (!GoogleAuthModule.currentUser.isLoggedIn) {
                const inputName = prompt("🎉 挑戰成功！未登入 Google，請輸入暱稱登錄排行榜：", "未登入巨鴨");
                if (inputName && inputName.trim() !== "") playerName = inputName;
            }

            LeaderboardData.add(playerName, totalElapsedSeconds);
            renderLeaderboard();
            document.getElementById('overlay-title').textContent = "🏆 通關成功！";
            document.getElementById('overlay-desc').textContent = `玩家：${playerName} | 耗時：${totalElapsedSeconds.toFixed(1)} 秒`;
            document.getElementById('game-overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
