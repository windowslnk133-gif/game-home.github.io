<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ohio Game 1 - 決戰微軟巨鴨</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-wrapper">
    <!-- 遊戲主畫布渲染層 -->
    <canvas id="gameCanvas" width="1000" height="600"></canvas>
    
    <!-- 頂部即時數據 UI 圖層 -->
    <div id="ui-layer">
        <div>
            <div>特務: <span id="player-name">匿名特務</span> | HP: <span id="player-hp-text">100</span> / 100 <span id="shield-status" style="color:#00ffcc;"></span></div>
            <div class="hp-bar-container"><div id="player-hp-bar"></div></div>
            <div id="stage-text" style="margin-top: 5px; color: #ffff00;">任務：尋找鑰匙並前往右側大門</div>
        </div>
        <div id="boss-ui">
            <div>Microsoft 巨鴨 Boss HP: <span id="boss-hp-text">23500</span> / 23500</div>
            <div class="hp-bar-container" style="width: 300px;"><div id="boss-hp-bar"></div></div>
            <div id="boss-action" style="color: #ff44ff; margin-top: 5px;"></div>
        </div>
    </div>

    <!-- 下方道具快捷欄 (手動/觸控點擊切換) -->
    <div id="hotbar">
        <div class="slot active" id="slot-1" onclick="switchSlot(1)">
            <span class="key-num">1</span>⌨️<br>鍵盤<br><span style="color:#888; font-size:9px;">自動連擊</span>
        </div>
        <div class="slot" id="slot-2" onclick="switchSlot(2)">
            <span class="key-num">2</span>💣<br>手雷<span class="cooldown" id="cd-grenade"></span>
        </div>
        <div class="slot" id="slot-3" onclick="switchSlot(3)">
            <span class="key-num">3</span>🛡️<br>防疫盾<span class="cooldown" id="cd-shield"></span>
        </div>
    </div>

    <!-- 行動端專用智慧虛擬按鍵 -->
    <div id="mobile-controls">
        <div class="btn-group">
            <div class="v-btn" id="btn-left">A</div>
            <div class="v-btn" id="btn-right">D</div>
        </div>
        <div class="btn-group">
            <div class="v-btn" id="btn-defend" style="background: rgba(0, 150, 255, 0.2); width: 85px; height: 85px; font-size: 16px;">防禦/副武</div>
            <div class="v-btn" id="btn-jump" style="width: 85px; height: 85px;">跳</div>
        </div>
    </div>

    <!-- 震撼彈出訊息文字區 -->
    <div id="game-msg"></div>

    <!-- 遊戲結束/結算畫面彈窗 (初始隱藏) -->
    <div id="overlay" style="display: none;">
        <h1 id="end-title" style="font-size: 50px; margin-bottom: 5px;"></h1>
        <h2 id="end-sub" style="margin-top:0;"></h2>
        <button class="menu-btn" onclick="startGame()">重新挑戰</button>
        <button class="menu-btn" style="background: linear-gradient(135deg, #a1a1a1, #757575); color: #000; margin-left: 10px;" onclick="window.location.href='index.html'">回主選單</button>
    </div>
</div>

<!-- 專案音效儲存區 -->
<audio id="bossMusic" src="./boss_musin.mp3" loop></audio>

<!-- 模組化底層 JavaScript 載入鏈（嚴格限制依賴順序） -->
<script src="data.js"></script>
<script src="tool.js"></script>
<script src="player.js"></script>
<script src="boss.js"></script>
<script src="game.js"></script>
<script src="game1.js"></script>

</body>
</html>
