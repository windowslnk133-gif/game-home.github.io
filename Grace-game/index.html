<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace 2D Side-Scroller</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* 頂部工作欄 / 狀態提示 */
        #status-bar {
            width: 800px;
            background: #111;
            border: 2px solid #333;
            border-bottom: none;
            color: #00ff00;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        canvas {
            background-color: #1a1a1a;
            border: 2px solid #333;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>

    <!-- 工作欄 -->
    <div id="status-bar">
        <div>【狀態】<span id="player-state">正常探索中</span></div>
        <div>【手電筒】<span id="flashlight-state" style="color: #ffcc00;">ON</span> [F鍵切換]</div>
        <div>【操作】A D 移動 | 空白鍵 跳躍 | R 鍵 躲藏(HIDE)</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 800;
        canvas.height = 400;

        // 遊戲基礎物理設定
        const gravity = 0.5;
        const groundY = 320;

        // 1. 玩家設定
        const player = {
            x: 100,
            y: groundY - 40,
            w: 24,
            h: 40,
            vx: 0,
            vy: 0,
            speed: 4,
            jumpForce: 10,
            isGrounded: true,
            flashlightOn: true,
            isHiding: false
        };

        // 2. 躲藏點 (HIDE 櫃子)
        const hidingSpots = [
            { x: 300, y: groundY - 70, w: 40, h: 70 },
            { x: 600, y: groundY - 70, w: 40, h: 70 }
        ];

        // 3. 怪物設定
        const monsters = [
            {
                name: '康乃馨',
                type: 'carnation',
                x: 700,
                y: groundY - 50,
                w: 30,
                h: 50,
                vx: -1.5,
                baseSpeed: 1.5,
                chaseSpeed: 4.5,
                color: '#ff4466',
                state: 'patrol' // patrol, chase
            },
            {
                name: '海底魚',
                type: 'anglerfish',
                x: 400,
                y: 100,
                w: 45,
                h: 30,
                vx: 1,
                vy: 0.5,
                baseSpeed: 1,
                color: '#33ccff',
                bobTimer: 0 // 用於上下漂浮
            }
        ];

        // 4. 按鍵監聽
        const keys = {};
        window.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            keys[key] = true;

            // F 鍵：切換手電筒 (只有在沒躲藏時有用)
            if (key === 'f' && !player.isHiding) {
                player.flashlightOn = !player.flashlightOn;
                document.getElementById('flashlight-state').innerText = player.flashlightOn ? "ON" : "OFF";
                document.getElementById('flashlight-state').style.color = player.flashlightOn ? "#ffcc00" : "#666";
            }

            // R 鍵：切換躲藏 (靠近櫃子時)
            if (key === 'r') {
                let nearSpot = hidingSpots.some(spot => 
                    player.x + player.w/2 > spot.x && player.x + player.w/2 < spot.x + spot.w
                );

                if (nearSpot) {
                    player.isHiding = !player.isHiding;
                    if (player.isHiding) {
                        player.flashlightOn = false; // 躲起來自動關手電筒
                        document.getElementById('player-state').innerText = "已躲藏 (HIDE)";
                        document.getElementById('player-state').style.color = "#00ffff";
                        document.getElementById('flashlight-state').innerText = "OFF";
                    } else {
                        document.getElementById('player-state').innerText = "正常探索中";
                        document.getElementById('player-state').style.color = "#00ff00";
                    }
                }
            }
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // 5. 邏輯更新
        function update() {
            // 如果正在躲藏，玩家不能移動，物理停止
            if (player.isHiding) {
                player.vx = 0;
                player.vy = 0;
            } else {
                // 左右移動 (A, D)
                if (keys['a']) player.vx = -player.speed;
                else if (keys['d']) player.vx = player.speed;
                else player.vx = 0;

                // 跳躍 (空白鍵)
                if (keys[' '] && player.isGrounded) {
                    player.vy = -player.jumpForce;
                    player.isGrounded = false;
                }

                // 套用重力
                player.vy += gravity;

                // 更新位置
                player.x += player.vx;
                player.y += player.vy;

                // 地面碰撞
                if (player.y >= groundY - player.h) {
                    player.y = groundY - player.h;
                    player.vy = 0;
                    player.isGrounded = true;
                }

                // 邊界限制
                if (player.x < 0) player.x = 0;
                if (player.x > canvas.width - player.w) player.x = canvas.width - player.w;
            }

            // --- 怪物 AI 邏輯 ---
            monsters.forEach(m => {
                // 檢查玩家是否暴露 (沒躲藏，且手電筒亮著或距離太近)
                let playerVisible = !player.isHiding && (player.flashlightOn || Math.abs(player.x - m.x) < 80);

                if (m.type === 'carnation') {
                    // 陸地怪物「康乃馨」AI
                    if (playerVisible) {
                        m.state = 'chase';
                        // 往玩家方向衝刺
                        m.vx = player.x > m.x ? m.chaseSpeed : -m.chaseSpeed;
                    } else {
                        m.state = 'patrol';
                        // 恢復一般巡邏速度
                        if (Math.abs(m.vx) !== m.baseSpeed) {
                            m.vx = m.vx > 0 ? m.baseSpeed : -m.baseSpeed;
                        }
                        // 撞牆回頭
                        if (m.x <= 0 || m.x >= canvas.width - m.w) m.vx *= -1;
                    }
                    m.x += m.vx;
                } 
                
                else if (m.type === 'anglerfish') {
                    // 空中怪物「海底魚」AI
                    m.bobTimer += 0.05;
                    m.y = 100 + Math.sin(m.bobTimer) * 30; // 上下漂浮
                    
                    // 海底魚緩慢左右游動
                    if (m.x <= 50 || m.x >= canvas.width - 100) m.vx *= -1;
                    m.x += m.vx;

                    // 如果玩家開著手電筒，海底魚會被光源吸引，緩慢往玩家靠攏
                    if (playerVisible && player.flashlightOn) {
                        m.x += (player.x - m.x) * 0.01;
                    }
                }

                // --- 死亡碰撞判定 ---
                if (!player.isHiding) {
                    if (player.x < m.x + m.w && player.x + player.w > m.x &&
                        player.y < m.y + m.h && player.y + player.h > m.y) {
                        alert(`你被 ${m.name} 抓到了！遊戲結束。`);
                        // 重設遊戲
                        player.x = 100;
                        player.y = groundY - player.h;
                        player.flashlightOn = true;
                        player.isHiding = false;
                        document.getElementById('player-state').innerText = "正常探索中";
                    }
                }
            });
        }

        // 6. 畫面繪製
        function draw() {
            // 背景黑幕（如果手電筒關閉，背景會變得極暗）
            ctx.fillStyle = player.flashlightOn ? '#1a1a1a' : '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 繪製地面
            ctx.fillStyle = '#222';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.fillStyle = '#333';
            ctx.fillRect(0, groundY, canvas.width, 4); // 地平線

            // 繪製躲藏點（置物櫃/陰暗門）
            hidingSpots.forEach(spot => {
                ctx.fillStyle = '#3a2e2b'; // 木質/鐵皮櫃顏色
                ctx.fillRect(spot.x, spot.y, spot.w, spot.h);
                // 櫃子花紋
                ctx.strokeStyle = '#221a18';
                ctx.lineWidth = 2;
                ctx.strokeRect(spot.x + 4, spot.y + 4, spot.w - 8, spot.h - 8);
                // 提示字
                ctx.fillStyle = '#888';
                ctx.font = '10px Arial';
                ctx.fillText("按R躲藏", spot.x - 2, spot.y - 8);
            });

            // 繪製玩家 (如果躲藏起來就不畫出本體，或者畫個半透明暗示)
            if (!player.isHiding) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(player.x, player.y, player.w, player.h);

                // 手電筒光束效果
                if (player.flashlightOn) {
                    ctx.fillStyle = 'rgba(255, 255, 200, 0.15)';
                    ctx.beginPath();
                    ctx.moveTo(player.x + player.w, player.y + 15);
                    ctx.lineTo(player.x + player.w + 180, player.y - 15);
                    ctx.lineTo(player.x + player.w + 180, player.y + 45);
                    ctx.fill();
                }
            } else {
                // 躲藏時在櫃子顯示 HIDE 字樣
                ctx.fillStyle = '#00ffff';
                ctx.font = 'bold 12px Arial';
                ctx.fillText("HIDDEN", player.x - 8, player.y - 10);
            }

            // 繪製怪物
            monsters.forEach(m => {
                ctx.fillStyle = m.color;
                ctx.fillRect(m.x, m.y, m.w, m.h);

                // 為怪物加上特色裝飾
                if (m.type === 'carnation') {
                    // 康乃馨：頂部畫一朵紅色的致命花瓣
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(m.x + m.w/2, m.y, 10, 0, Math.PI * 2);
                    ctx.fill();

                    // 暴走狀態眼睛變紅
                    ctx.fillStyle = m.state === 'chase' ? '#fff' : '#000';
                    ctx.fillRect(m.vx > 0 ? m.x + m.w - 8 : m.x + 4, m.y + 12, 4, 4);
                } 
                else if (m.type === 'anglerfish') {
                    // 海底魚：前方畫一個發光的誘餌（鮟鱇魚燈）
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(m.x, m.y + 10);
                    ctx.quadraticCurveTo(m.x - 10, m.y - 10, m.x - 15, m.y);
                    ctx.stroke();

                    // 誘餌發光球
                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(m.x - 15, m.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 怪物名稱標籤
                ctx.fillStyle = '#fff';
                ctx.font = '11px Arial';
                ctx.fillText(m.name, m.x - 5, m.y - 12);
            });
        }

        // 7. 遊戲主迴圈
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
